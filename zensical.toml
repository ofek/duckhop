[project]
site_name = "DuckHop"
site_url = "https://ofek.dev/duckhop/"
site_description = "DuckDB extension for persistent graph indexing and native traversal"
repo_url = "https://github.com/ofek/duckhop"
repo_name = "ofek/duckhop"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "How-to guides" = [
    { "Develop" = [
      "how-to/dev/index.md",
      { "Write documentation" = "how-to/dev/write-documentation.md" },
    ] },
  ] },
  { "Reference" = [
    { "Develop" = [
      { "Tasks" = "reference/dev/tasks.md" },
      { "Platforms and dependencies" = "reference/dev/platforms.md" },
      { "Repository layout" = "reference/dev/repository-layout.md" },
    ] },
  ] },
  { "Explanation" = [
    { "Project scope" = "explanation/project-scope.md" },
  ] },
]

[project.theme]
features = ["navigation.sections", "navigation.indexes", "navigation.expand", "navigation.top", "search.highlight"]

# Automatic mode falls back to dark when the browser reports no preference.
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to system preference"
