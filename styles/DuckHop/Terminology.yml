extends: substitution
message: "Use '%s' instead of '%s'."
level: error
ignorecase: false
swap:
  '[Dd]uckhop': DuckHop
  '[Dd]uckdb': DuckDB
  '[Gg]ithub': GitHub
  'Github [Aa]ctions': GitHub Actions
  'MacOS|Mac OS|MacOs': macOS
  windows: Windows
  linux: Linux
  'Mise|MISE': mise
  zensical: Zensical
  'Diataxis|diataxis': Diátaxis

