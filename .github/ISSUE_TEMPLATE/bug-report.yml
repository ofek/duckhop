name: Bug report
description: Report a reproducible build, tooling, or extension problem.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For suspected vulnerabilities, follow [SECURITY.md](https://github.com/ofek/duckhop/blob/main/SECURITY.md) and do not post details here."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed result and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Include the smallest example and the mise commands you ran.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the DuckHop commit, operating system, architecture, and relevant output from mise run doctor.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Remove secrets and unrelated personal data from logs.
      render: text
